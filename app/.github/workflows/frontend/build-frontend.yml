name: Build Frontend
permissions:
  packages: write
  contents: write
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

  push:
    paths:
      - "footbets.App/ClientApp/**"

env:
  WORKDIR: "footbets.App/ClientApp"
  NODE_VERSION: "20"
  PNPM_VERSION: "8"
  NODE_OPTIONS: "--max_old_space_size=4096"
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  frontend-build:
    name: Run CI (Lint, Test, Build)
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion != 'failure' }}
    outputs:
      date: ${{ steps.date.outputs.date }}
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}

    steps:
      - name: 🔄 Checkout repository
        uses: actions/checkout@v3
      - name: Get current date # get the date of the build
        id: date
        run: echo "::set-output name=date::$(date +%s)"

      - name: ⚙️ Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: "${{ env.WORKDIR }}/pnpm-lock.yaml"

      - name: 📦 Install dependencies
        run: pnpm install

      - name: 🧹 Run Linter
        run: pnpm lint

      - name: 🧪 Run Unit Tests (Vitest)
        run: pnpm test:coverage

      - name: 🎭 Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      - name: 🎭 Run E2E Tests (Playwright)
        run: pnpm test:e2e

      - name: 📝 Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: ${{ env.ACT != 'true' &&  !cancelled() }}
        with:
          name: playwright-report
          path: ${{ env.WORKDIR }}/playwright-report/
          retention-days: 2
      - name: 🏗️ Build Project
        run: pnpm build

  docker:
    name: Docker Build image
    runs-on: ubuntu-latest
    needs: frontend-build
    outputs:
      date: ${{ steps.date.outputs.date }}
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Get current date # get the date of the build
        id: date
        run: echo "::set-output name=date::$(date +%s)"

      - name: Build the Docker image
        run: |
          IMAGE_NAME="${REGISTRY,,}/frontend-app"
          CONTEXT_PATH="$GITHUB_WORKSPACE/${{ env.WORKDIR }}"
          docker build "$CONTEXT_PATH" --tag $IMAGE_NAME:${{ steps.date.outputs.date }}

      # - name: Login to GitHub Container Registry
      #   uses: docker/login-action@v2
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GHCR_TOKEN }}

