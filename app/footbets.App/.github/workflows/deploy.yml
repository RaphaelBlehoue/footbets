# =====================================
# Déploiement global ou orchestration - deploy.yml
# =====================================

name: Deploy Orchestration

on:
  workflow_run:
    workflows: ["Frontend CI", "Backend CI"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: Global Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Docker Compose (multi-env)
        run: docker compose -f docker-compose.uat.yml up -d

      # OU, si tu es en production
      # - name: Deploy to Kubernetes
      #   run: kubectl apply -f k8s/

      - name: Notify success
        run: echo "Deployment complete! ✅"
# =====================================
# PROCESSUS DE VERSIONNEMENT
# =====================================
# - Pour déployer en dev ou uat :
#   1. Créer une branche release depuis develop (ex: release/update-to-dev-v1.4.1)
#   2. Tagguer avec un tag mineur (ex: v1.4.1)
#   3. Le push déclenche le changelog et le déploiement
#
# - Pour déployer en production :
#   1. Créer une PR manuelle de la dernière release majeure (ex: v1.5.0) vers main
#   2. Après merge, déclencher manuellement ou automatiquement le déploiement prod
#   3. Le même tag est utilisé pour générer le changelog via git-cliff
